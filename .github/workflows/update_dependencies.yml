name: Auto-update Dependencies

on:
  schedule:
    # Runs weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Check and update dependency versions
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_dependencies.py
          if [ -f /tmp/update_summary.txt ]; then
            echo "UPDATED=true" >> "$GITHUB_OUTPUT"
            SUMMARY=$(cat /tmp/update_summary.txt)
            echo "SUMMARY=$SUMMARY" >> "$GITHUB_OUTPUT"
          else
            echo "UPDATED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update MODULE.bazel.lock
        if: steps.update.outputs.UPDATED == 'true'
        run: |
          if command -v bazel &> /dev/null; then
            bazel mod deps || true
          fi

      - name: Create Pull Request
        if: steps.update.outputs.UPDATED == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "build: update dependencies (${{ steps.update.outputs.SUMMARY }})"
          branch: "auto-update-dependencies"
          delete-branch: true
          title: "build: update dependencies"
          body: |
            Automated weekly update for dependencies in `CMakeLists.txt` and `MODULE.bazel`:

            ${{ steps.update.outputs.SUMMARY }}

            ---
            *Note: Please verify that CI builds and tests pass across all platforms before merging.*
          labels: |
            dependencies
            automated-pr
