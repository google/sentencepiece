name: CrossBuild

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:    
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: m68k is excluded due to build errors.
        arch: [ i686, arm, aarch64, riscv64, powerpc, powerpc64, powerpc64le, s390x, sparc64, sh4, alpha ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install cross tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sudo qemu-user gdb zstd dwarfdump {gcc,g++}-14-{i686,aarch64,riscv64,powerpc,powerpc64,powerpc64le,s390x,sparc64,sh4,alpha}-linux-gnu {gcc,g++}-14-arm-linux-gnueabihf
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-14 /usr/bin/arm-linux-gnu-gcc-14
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-g++-14 /usr/bin/arm-linux-gnu-g++-14
        sudo ln -sf /usr/arm-linux-gnueabihf /usr/arm-linux-gnu

    - name: Build
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        mkdir -p build
        cd build
        qemu_arch=`echo "$ARCH" | sed -e s/powerpc/ppc/ -e s/686/386/`
        env CXX=/usr/bin/${ARCH}-linux-gnu-g++-14 CC=/usr/bin/${ARCH}-linux-gnu-gcc-14 cmake .. -DSPM_BUILD_TEST=ON -DSPM_ENABLE_SHARED=OFF -DCMAKE_FIND_ROOT_PATH=/usr/${ARCH}-linux-gnu -DSPM_CROSS_SYSTEM_PROCESSOR=${ARCH} -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-${qemu_arch};-L;/usr/${ARCH}-linux-gnu"
        make -j$(nproc)

    - name: Test on QEMU
      if: matrix.arch != 'sparc64' && matrix.arch != 'sh4'
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        cd build
        qemu_arch=`echo "$ARCH" | sed -e s/powerpc/ppc/ -e s/686/386/`
        qemu-${qemu_arch} -L /usr/${ARCH}-linux-gnu src/spm_test
